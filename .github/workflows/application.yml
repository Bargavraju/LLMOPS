name: POC1 Application Deployment

on:
  # Run after infrastructure workflow completes successfully
  workflow_run:
    workflows:
      - POC1 Infrastructure
    types:
      - completed

  # Also allow deployment when application code changes
  push:
    branches:
      - main
    paths:
      - 'POC1_with_LLMOps/main.py'
      - 'POC1_with_LLMOps/Dockerfile'
      - 'POC1_with_LLMOps/requirements.txt'
      - 'POC1_with_LLMOps/scripts/**'

  # Allow manual execution
  workflow_dispatch:
    inputs:
      infra_run_id:
        description: 'Infrastructure workflow run ID. Leave empty to use latest successful run.'
        required: false
        type: string


permissions:
  id-token: write
  contents: read
  actions: read


env:
  IMAGE_REPOSITORY: healthcare-agent
  CONTAINER_PORT: 8000
  INGRESS_TYPE: external


jobs:

  # ============================================================
  # 1. Get Infrastructure Environment
  # ============================================================
  get-infra-env:
    name: Get Infrastructure Environment
    runs-on: ubuntu-latest

    # Do not deploy if infrastructure workflow failed
    if: |
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Determine which infrastructure run to use
      # --------------------------------------------------------
      - name: Determine infrastructure run ID
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          if [ "${{ github.event_name }}" = "workflow_run" ]; then

            INFRA_RUN_ID="${{ github.event.workflow_run.id }}"

          elif [ -n "${{ inputs.infra_run_id }}" ]; then

            INFRA_RUN_ID="${{ inputs.infra_run_id }}"

          else

            echo "Finding latest successful infrastructure workflow..."

            INFRA_RUN_ID=$(gh run list \
              --workflow infrastructure.yml \
              --branch main \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')

          fi

          if [ -z "$INFRA_RUN_ID" ]; then
            echo "ERROR: Could not find a successful infrastructure workflow run."
            exit 1
          fi

          echo "Using infrastructure run: $INFRA_RUN_ID"

          echo "INFRA_RUN_ID=$INFRA_RUN_ID" >> "$GITHUB_ENV"

      # --------------------------------------------------------
      # Download infra-env artifact
      # --------------------------------------------------------
      - name: Download infra-env artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          mkdir -p ./infra-env

          gh run download "$INFRA_RUN_ID" \
            --name infra-env \
            --dir ./infra-env

          echo "Downloaded infrastructure artifact:"
          find ./infra-env -type f -print

      # --------------------------------------------------------
      # Validate environment file
      # --------------------------------------------------------
      - name: Validate infrastructure environment
        shell: bash
        run: |

          ENV_FILE="./infra-env/infra_output.env"

          if [ ! -f "$ENV_FILE" ]; then
            echo "ERROR: infra_output.env was not found."
            exit 1
          fi

          echo "Infrastructure environment file found."

          # Do NOT print the complete file.
          echo "Available infrastructure variables:"

          grep -E '^[A-Z_]+=' "$ENV_FILE" \
            | cut -d'=' -f1


      # --------------------------------------------------------
      # Upload artifact for next jobs
      # --------------------------------------------------------
      - name: Upload infra-env for application jobs
        uses: actions/upload-artifact@v4
        with:
          name: application-infra-env
          path: ./infra-env/infra_output.env
          retention-days: 1


  # ============================================================
  # 2. Build and Push Docker Image
  # ============================================================
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    needs:
      - get-infra-env

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Download infrastructure environment
      # --------------------------------------------------------
      - name: Download application infrastructure environment
        uses: actions/download-artifact@v4
        with:
          name: application-infra-env
          path: ./infra-env


      # --------------------------------------------------------
      # Load infrastructure variables
      # --------------------------------------------------------
      - name: Load infrastructure variables
        shell: bash
        run: |

          set -euo pipefail

          ENV_FILE="./infra-env/infra_output.env"

          if [ ! -f "$ENV_FILE" ]; then
            echo "ERROR: Infrastructure environment file not found."
            exit 1
          fi

          set -a
          source "$ENV_FILE"
          set +a

          echo "ACR_LOGIN_SERVER=$ACR_LOGIN_SERVER" >> "$GITHUB_ENV"
          echo "ACR_NAME=$ACR_NAME" >> "$GITHUB_ENV"

      # --------------------------------------------------------
      # Azure Login using OIDC
      # --------------------------------------------------------
      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # --------------------------------------------------------
      # Login to ACR
      # --------------------------------------------------------
      - name: Login to Azure Container Registry
        run: |
          az acr login \
            --name "$ACR_NAME"


      # --------------------------------------------------------
      # Calculate Docker image tag
      # --------------------------------------------------------
      - name: Calculate image tag
        shell: bash
        run: |

          SHORT_SHA="${GITHUB_SHA::7}"

          IMAGE="${ACR_LOGIN_SERVER}/${IMAGE_REPOSITORY}:${SHORT_SHA}"
          IMAGE_LATEST="${ACR_LOGIN_SERVER}/${IMAGE_REPOSITORY}:latest"

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "IMAGE_LATEST=$IMAGE_LATEST" >> "$GITHUB_ENV"

          echo "Image tag: $SHORT_SHA"
          echo "Image: $IMAGE"


      # --------------------------------------------------------
      # Build Docker image
      # --------------------------------------------------------
      - name: Build Docker image
        run: |

          docker build \
            -f POC1_with_LLMOps/Dockerfile \
            -t "$IMAGE" \
            -t "$IMAGE_LATEST" \
            POC1_with_LLMOps


      # --------------------------------------------------------
      # Push Docker image
      # --------------------------------------------------------
      - name: Push Docker image
        run: |

          docker push "$IMAGE"
          docker push "$IMAGE_LATEST"

          echo "Docker image pushed successfully."


  # ============================================================
  # 3. Deploy Azure Container App
  # ============================================================
  deploy-container-app:
    name: Deploy Azure Container App
    runs-on: ubuntu-latest

    needs:
      - get-infra-env
      - build-and-push

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Download infrastructure environment
      # --------------------------------------------------------
      - name: Download application infrastructure environment
        uses: actions/download-artifact@v4
        with:
          name: application-infra-env
          path: ./infra-env


      # --------------------------------------------------------
      # Load infrastructure variables
      # --------------------------------------------------------
      - name: Load infrastructure variables
        shell: bash
        run: |

          set -euo pipefail

          ENV_FILE="./infra-env/infra_output.env"

          if [ ! -f "$ENV_FILE" ]; then
            echo "ERROR: Infrastructure environment file not found."
            exit 1
          fi

          set -a
          source "$ENV_FILE"
          set +a

          echo "ACR_LOGIN_SERVER=$ACR_LOGIN_SERVER" >> "$GITHUB_ENV"
          echo "ACR_NAME=$ACR_NAME" >> "$GITHUB_ENV"
          echo "RESOURCE_GROUP=$RESOURCE_GROUP" >> "$GITHUB_ENV"
          echo "LOCATION=$LOCATION" >> "$GITHUB_ENV"
          echo "CONTAINER_APP_ENV=$CONTAINER_APP_ENV" >> "$GITHUB_ENV"
          echo "CONTAINER_APP_NAME=$CONTAINER_APP_NAME" >> "$GITHUB_ENV"
          echo "LOG_ANALYTICS_NAME=$LOG_ANALYTICS_NAME" >> "$GITHUB_ENV"
          echo "KEYVAULT_URL=$KEYVAULT_URL" >> "$GITHUB_ENV"
          echo "UAMI_ID=$UAMI_ID" >> "$GITHUB_ENV"
          echo "UAMI_CLIENT_ID=$UAMI_CLIENT_ID" >> "$GITHUB_ENV"


      # --------------------------------------------------------
      # Azure Login
      # --------------------------------------------------------
      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # --------------------------------------------------------
      # Configure Azure CLI
      # --------------------------------------------------------
      - name: Configure Azure CLI
        run: |

          az config set extension.use_dynamic_install=yes_without_prompt

          az extension add \
            --name containerapp \
            --upgrade


      # --------------------------------------------------------
      # Calculate image reference
      # --------------------------------------------------------
      - name: Calculate image reference
        shell: bash
        run: |

          SHORT_SHA="${GITHUB_SHA::7}"

          IMAGE="${ACR_LOGIN_SERVER}/${IMAGE_REPOSITORY}:${SHORT_SHA}"

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

          echo "Deploying image:"
          echo "$IMAGE"


      # --------------------------------------------------------
      # Register Azure providers
      # --------------------------------------------------------
      - name: Register Azure providers
        run: |

          az provider register \
            --namespace Microsoft.App \
            --wait

          az provider register \
            --namespace Microsoft.OperationalInsights \
            --wait


      # --------------------------------------------------------
      # Create Resource Group
      # --------------------------------------------------------
      - name: Create Resource Group
        run: |

          az group create \
            --name "$RESOURCE_GROUP" \
            --location "$LOCATION" \
            --output none


      # --------------------------------------------------------
      # Create Log Analytics Workspace
      # --------------------------------------------------------
      - name: Create Log Analytics Workspace if required
        shell: bash
        run: |

          if ! az monitor log-analytics workspace show \
            --resource-group "$RESOURCE_GROUP" \
            --workspace-name "$LOG_ANALYTICS_NAME" \
            > /dev/null 2>&1; then

            echo "Creating Log Analytics workspace..."

            az monitor log-analytics workspace create \
              --resource-group "$RESOURCE_GROUP" \
              --workspace-name "$LOG_ANALYTICS_NAME" \
              --location "$LOCATION"

          else

            echo "Log Analytics workspace already exists."

          fi


      # --------------------------------------------------------
      # Get Log Analytics information
      # --------------------------------------------------------
      - name: Get Log Analytics information
        shell: bash
        run: |

          LAW_CUST_ID=$(az monitor log-analytics workspace show \
            --resource-group "$RESOURCE_GROUP" \
            --workspace-name "$LOG_ANALYTICS_NAME" \
            --query customerId \
            --output tsv)

          LAW_KEY=$(az monitor log-analytics workspace get-shared-keys \
            --resource-group "$RESOURCE_GROUP" \
            --workspace-name "$LOG_ANALYTICS_NAME" \
            --query primarySharedKey \
            --output tsv)

          echo "LAW_CUST_ID=$LAW_CUST_ID" >> "$GITHUB_ENV"
          echo "LAW_KEY=$LAW_KEY" >> "$GITHUB_ENV"


      # --------------------------------------------------------
      # Create Container App Environment
      # --------------------------------------------------------
      - name: Create Container App Environment if required
        shell: bash
        run: |

          if ! az containerapp env show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_APP_ENV" \
            > /dev/null 2>&1; then

            echo "Creating Container App Environment..."

            az containerapp env create \
              --resource-group "$RESOURCE_GROUP" \
              --name "$CONTAINER_APP_ENV" \
              --location "$LOCATION" \
              --logs-workspace-id "$LAW_CUST_ID" \
              --logs-workspace-key "$LAW_KEY"

          else

            echo "Container App Environment already exists."

          fi


      # --------------------------------------------------------
      # Create or Update Container App
      # --------------------------------------------------------
      - name: Create or Update Container App
        shell: bash
        run: |

          if ! az containerapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_APP_NAME" \
            > /dev/null 2>&1; then

            echo "Container App does not exist. Creating..."

            if [ -n "$UAMI_ID" ]; then

              az containerapp create \
                --resource-group "$RESOURCE_GROUP" \
                --name "$CONTAINER_APP_NAME" \
                --environment "$CONTAINER_APP_ENV" \
                --image "$IMAGE" \
                --registry-server "$ACR_LOGIN_SERVER" \
                --ingress "$INGRESS_TYPE" \
                --registry-identity "$UAMI_ID"

            else

              az containerapp create \
                --resource-group "$RESOURCE_GROUP" \
                --name "$CONTAINER_APP_NAME" \
                --environment "$CONTAINER_APP_ENV" \
                --image "$IMAGE" \
                --registry-server "$ACR_LOGIN_SERVER" \
                --system-assigned

            fi

          else

            echo "Container App exists. Updating image..."

            az containerapp update \
              --resource-group "$RESOURCE_GROUP" \
              --name "$CONTAINER_APP_NAME" \
              --image "$IMAGE"

          fi


      # --------------------------------------------------------
      # Configure Container App ingress
      # --------------------------------------------------------
      - name: Configure Container App ingress
        shell: bash
        run: |

          az containerapp ingress enable \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_APP_NAME" \
            --type "$INGRESS_TYPE" \
            --target-port "$CONTAINER_PORT"


      # --------------------------------------------------------
      # Configure ACR authentication
      # --------------------------------------------------------
      - name: Configure ACR authentication
        shell: bash
        run: |

          set -euo pipefail

          ACR_ID=$(az acr show \
            --name "$ACR_NAME" \
            --query id \
            --output tsv)

          if [ -n "$UAMI_ID" ]; then

            echo "Using User Assigned Managed Identity."

            # Attach UAMI
            az containerapp identity assign \
              --resource-group "$RESOURCE_GROUP" \
              --name "$CONTAINER_APP_NAME" \
              --user-assigned "$UAMI_ID"


            # Get UAMI principal ID
            UAMI_PRINCIPAL_ID=$(az identity show \
              --ids "$UAMI_ID" \
              --query principalId \
              --output tsv)


            # Grant AcrPull
            az role assignment create \
              --assignee-object-id "$UAMI_PRINCIPAL_ID" \
              --assignee-principal-type ServicePrincipal \
              --role "AcrPull" \
              --scope "$ACR_ID" \
              > /dev/null || true


            # Configure Container App registry identity
            for i in 1 2 3 4 5; do

              if az containerapp registry set \
                --resource-group "$RESOURCE_GROUP" \
                --name "$CONTAINER_APP_NAME" \
                --server "$ACR_LOGIN_SERVER" \
                --identity "$UAMI_ID"; then

                echo "ACR registry identity configured."
                break

              fi

              echo "Retrying registry configuration ($i/5)..."
              sleep 5

            done

          else

            echo "Using System Assigned Managed Identity."

            az containerapp identity assign \
              --resource-group "$RESOURCE_GROUP" \
              --name "$CONTAINER_APP_NAME" \
              --system-assigned


            PRINCIPAL_ID=$(az containerapp show \
              --resource-group "$RESOURCE_GROUP" \
              --name "$CONTAINER_APP_NAME" \
              --query identity.principalId \
              --output tsv)


            az role assignment create \
              --assignee-object-id "$PRINCIPAL_ID" \
              --assignee-principal-type ServicePrincipal \
              --role "AcrPull" \
              --scope "$ACR_ID" \
              > /dev/null || true


            az containerapp registry set \
              --resource-group "$RESOURCE_GROUP" \
              --name "$CONTAINER_APP_NAME" \
              --server "$ACR_LOGIN_SERVER" \
              --identity system

          fi


      # --------------------------------------------------------
      # Configure application environment variables
      # --------------------------------------------------------
      - name: Configure Container App environment variables
        shell: bash
        run: |

          if [ -n "$UAMI_CLIENT_ID" ]; then

            az containerapp update \
              --resource-group "$RESOURCE_GROUP" \
              --name "$CONTAINER_APP_NAME" \
              --set-env-vars \
                KEYVAULT_URL="$KEYVAULT_URL" \
                AZURE_CLIENT_ID="$UAMI_CLIENT_ID"

          else

            az containerapp update \
              --resource-group "$RESOURCE_GROUP" \
              --name "$CONTAINER_APP_NAME" \
              --set-env-vars \
                KEYVAULT_URL="$KEYVAULT_URL"

          fi


      # --------------------------------------------------------
      # Display Container App URL
      # --------------------------------------------------------
      - name: Display Container App URL
        shell: bash
        run: |

          echo "============================================"
          echo "Container App URL"
          echo "============================================"

          FQDN=$(az containerapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_APP_NAME" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)

          echo "https://$FQDN"
