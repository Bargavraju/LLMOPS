name: POC1 Data Preparation

on:
  push:
    branches:
      - main
    paths:
      - 'POC1_with_LLMOps/scripts/**'
      - 'POC1_with_LLMOps/requirements.txt'

  workflow_dispatch:
    inputs:
      infra_run_id:
        description: 'Infrastructure workflow run ID (optional)'
        required: false
        type: string

  workflow_run:
    workflows:
      - POC1 Infrastructure
    types:
      - completed


permissions:
  id-token: write
  contents: read
  actions: read


env:
  PYTHON_VERSION: '3.11'
  REQUIREMENTS_FILE: 'POC1_with_LLMOps/requirements.txt'


jobs:

  # ============================================================
  # JOB 1 - Get Infrastructure Environment
  # ============================================================
  get-infra-env:
    name: Get Infrastructure Environment
    runs-on: ubuntu-latest

    if: |
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    steps:

      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Determine Infrastructure Workflow Run
      # --------------------------------------------------------
      - name: Determine infrastructure run ID
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_run" ]; then

            INFRA_RUN_ID="${{ github.event.workflow_run.id }}"

          elif [ -n "${{ inputs.infra_run_id }}" ]; then

            INFRA_RUN_ID="${{ inputs.infra_run_id }}"

          else

            echo "Finding latest successful infrastructure workflow..."

            INFRA_RUN_ID=$(gh run list \
              --workflow infrastructure.yml \
              --branch main \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')

          fi

          if [ -z "$INFRA_RUN_ID" ]; then
            echo "ERROR: No successful infrastructure workflow found."
            exit 1
          fi

          echo "Infrastructure workflow run: $INFRA_RUN_ID"

          echo "INFRA_RUN_ID=$INFRA_RUN_ID" >> "$GITHUB_ENV"


      # --------------------------------------------------------
      # Download infra-env artifact
      # --------------------------------------------------------
      - name: Download infra-env artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          set -euo pipefail

          mkdir -p ./infra-env

          gh run download "$INFRA_RUN_ID" \
            --name infra-env \
            --dir ./infra-env

          echo "Infrastructure artifact downloaded."

          find ./infra-env -type f -print


      # --------------------------------------------------------
      # Validate Environment File
      # --------------------------------------------------------
      - name: Validate infrastructure environment
        shell: bash
        run: |

          set -euo pipefail

          ENV_FILE="./infra-env/infra_output.env"

          if [ ! -f "$ENV_FILE" ]; then
            echo "ERROR: infra_output.env was not found."
            exit 1
          fi

          echo "infra_output.env found successfully."

          echo "Environment variables available:"

          grep -E '^[A-Z_]+=' "$ENV_FILE" \
            | cut -d'=' -f1


      # --------------------------------------------------------
      # Upload artifact for next job
      # --------------------------------------------------------
      - name: Upload infrastructure environment
        uses: actions/upload-artifact@v4
        with:
          name: application-infra-env
          path: ./infra-env/infra_output.env
          retention-days: 1


  # ============================================================
  # JOB 2 - Run Python Scripts Sequentially
  # ============================================================
  run-python-scripts:
    name: Run Python Scripts
    runs-on: ubuntu-latest

    needs:
      - get-infra-env

    steps:

      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Setup Python 3.11
      # --------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}


      # --------------------------------------------------------
      # Download Infrastructure Environment
      # --------------------------------------------------------
      - name: Download infrastructure environment
        uses: actions/download-artifact@v4
        with:
          name: application-infra-env
          path: ./infra-env


      # --------------------------------------------------------
      # Load KEYVAULT_URL
      # --------------------------------------------------------
      - name: Load infrastructure variables
        shell: bash
        run: |

          set -euo pipefail

          ENV_FILE="./infra-env/infra_output.env"

          if [ ! -f "$ENV_FILE" ]; then
            echo "ERROR: infra_output.env not found."
            exit 1
          fi

          set -a
          source "$ENV_FILE"
          set +a

          if [ -z "${KEYVAULT_URL:-}" ]; then
            echo "ERROR: KEYVAULT_URL is not available."
            exit 1
          fi

          echo "KEYVAULT_URL=$KEYVAULT_URL" >> "$GITHUB_ENV"

          echo "KEYVAULT_URL loaded successfully."


      # --------------------------------------------------------
      # Azure Login using GitHub OIDC
      # --------------------------------------------------------
      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # --------------------------------------------------------
      # Verify Azure Login
      # --------------------------------------------------------
      - name: Verify Azure authentication
        shell: bash
        run: |

          az account show \
            --query "{subscription:id, tenant:tenantId, user:user.name}" \
            --output table


      # --------------------------------------------------------
      # Install Python Dependencies
      # --------------------------------------------------------
      - name: Install Python dependencies
        shell: bash
        run: |

          python --version

          python -m pip install --upgrade pip

          python -m pip install \
            -r "${{ env.REQUIREMENTS_FILE }}"


      # --------------------------------------------------------
      # Install Microsoft ODBC Driver 18
      # Required by adding_data.py
      # --------------------------------------------------------
      - name: Install Microsoft ODBC Driver 18
        shell: bash
        run: |

          set -euo pipefail

          curl -fsSL \
            https://packages.microsoft.com/keys/microsoft.asc \
            | sudo gpg --dearmor \
            -o /usr/share/keyrings/microsoft-prod.gpg

          curl -fsSL \
            https://packages.microsoft.com/config/ubuntu/24.04/prod.list \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list

          sudo apt-get update

          sudo ACCEPT_EULA=Y apt-get install -y \
            msodbcsql18 \
            unixodbc-dev

          echo "Installed ODBC drivers:"

          odbcinst -q -d


      # ========================================================
      # SCRIPT 1 - creating_index.py
      # ========================================================
      - name: Run creating_index.py
        shell: bash
        run: |

          set -euo pipefail

          echo "=========================================="
          echo "Running creating_index.py"
          echo "=========================================="

          python \
            "POC1_with_LLMOps/scripts/creating_index.py"


      # ========================================================
      # SCRIPT 2 - adding_data.py
      # ========================================================
      - name: Run adding_data.py
        shell: bash
        run: |

          set -euo pipefail

          echo "=========================================="
          echo "Running adding_data.py"
          echo "=========================================="

          python \
            "POC1_with_LLMOps/scripts/adding_data.py"


      # ========================================================
      # SCRIPT 3 - content_filters.py
      # ========================================================
      - name: Run content_filters.py
        shell: bash
        run: |

          set -euo pipefail

          echo "=========================================="
          echo "Running content_filters.py"
          echo "=========================================="

          python \
            "POC1_with_LLMOps/scripts/content_filters.py"


      # ========================================================
      # SCRIPT 4 - creating_agent.py
      # ========================================================
      - name: Run creating_agent.py
        shell: bash
        run: |

          set -euo pipefail

          echo "=========================================="
          echo "Running creating_agent.py"
          echo "=========================================="

          python \
            "POC1_with_LLMOps/scripts/creating_agent.py"


      # --------------------------------------------------------
      # Completion
      # --------------------------------------------------------
      - name: Data preparation completed
        shell: bash
        run: |

          echo "=========================================="
          echo "DATA PREPARATION COMPLETED SUCCESSFULLY"
          echo "=========================================="
