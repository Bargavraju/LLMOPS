# azure-pipelines-app.yml
# Build -> Push to ACR -> Create/Update Azure Container App

trigger:
  branches:
    include:
      - POC1-main
  paths:
    include:
      - 'POC1_with_LLMOps/main.py'

resources:
  pipelines:
    - pipeline: infra
      source: "POC1 Infra"
      trigger: none

variables:
  azureServiceConnection: 'POCsServiceConnection'
  dockerfilePath: 'POC1_with_LLMOps/Dockerfile'
  buildContext:   'POC1_with_LLMOps'
  imageRepository: 'healthcare-agent'
  containerPort: '8000'
  ingressType:   'external'

pool:
  vmImage: ubuntu-latest

stages:
- stage: AppBuildDeploy
  displayName: Build, Push & Deploy
  jobs:

  # 1) Read env artifact from infra pipeline
  - job: GetEnv
    displayName: Download env and expose variables
    steps:
      - download: infra
        artifact: infra-env
        displayName: Download 'infra-env' artifact

      - bash: |
          set -euo pipefail
          ENV_FILE="$(Pipeline.Workspace)/infra/infra-env/infra_output.env"
          echo "Using ENV_FILE: $ENV_FILE"
          test -f "$ENV_FILE" || { echo "Env file not found"; ls -R "$(Pipeline.Workspace)"; exit 1; }
          cat "$ENV_FILE"

          get_val () { grep -E "^$1=" "$ENV_FILE" | head -n1 | cut -d'=' -f2- | tr -d '\r'; }

          echo "##vso[task.setvariable variable=KEYVAULT_URL;isOutput=true]$(get_val KEYVAULT_URL)"
          echo "##vso[task.setvariable variable=ACR_LOGIN_SERVER;isOutput=true]$(get_val ACR_LOGIN_SERVER)"
          echo "##vso[task.setvariable variable=ACR_NAME;isOutput=true]$(get_val ACR_NAME)"
          echo "##vso[task.setvariable variable=RESOURCE_GROUP;isOutput=true]$(get_val RESOURCE_GROUP)"
          echo "##vso[task.setvariable variable=LOCATION;isOutput=true]$(get_val LOCATION)"
          echo "##vso[task.setvariable variable=CONTAINER_APP_ENV;isOutput=true]$(get_val CONTAINER_APP_ENV)"
          echo "##vso[task.setvariable variable=CONTAINER_APP_NAME;isOutput=true]$(get_val CONTAINER_APP_NAME)"
          echo "##vso[task.setvariable variable=LOG_ANALYTICS_NAME;isOutput=true]$(get_val LOG_ANALYTICS_NAME)"
          # Optional UAMI (may be empty in env file)
          echo "##vso[task.setvariable variable=UAMI_ID;isOutput=true]$(get_val UAMI_ID || true)"
          echo "##vso[task.setvariable variable=UAMI_CLIENT_ID;isOutput=true]$(get_val UAMI_CLIENT_ID || true)"
        name: loadEnv
        displayName: Load variables from env file

  # 2) Build & push Docker image
  - job: BuildAndPush
    displayName: Build and push image to ACR
    dependsOn: GetEnv
    variables:
      ACR_LOGIN_SERVER: $[ dependencies.GetEnv.outputs['loadEnv.ACR_LOGIN_SERVER'] ]
      ACR_NAME:         $[ dependencies.GetEnv.outputs['loadEnv.ACR_NAME'] ]
    steps:
      - checkout: self

      - bash: |
          set -euo pipefail
          SHORT_SHA="$(echo $(Build.SourceVersion) | cut -c1-7)"
          echo "##vso[task.setvariable variable=ImageTag]${SHORT_SHA}"
          echo "Tag: ${SHORT_SHA}"
        displayName: Compute image tag

      - task: AzureCLI@2
        displayName: Build & push image
        inputs:
          azureSubscription: $(azureServiceConnection)
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail

            echo "ACR: $(ACR_NAME) ($(ACR_LOGIN_SERVER))"
            az acr login -n "$(ACR_NAME)"

            IMAGE="$(ACR_LOGIN_SERVER)/$(imageRepository):$(ImageTag)"
            IMAGE_LATEST="$(ACR_LOGIN_SERVER)/$(imageRepository):latest"

            echo "Building $IMAGE"
            docker build -f "$(dockerfilePath)" -t "$IMAGE" -t "$IMAGE_LATEST" "$(buildContext)"

            echo "Pushing $IMAGE and :latest"
            docker push "$IMAGE"
            docker push "$IMAGE_LATEST"

            echo "##vso[task.setvariable variable=FullImageRef;isOutput=true]$IMAGE"
        name: buildpush

  # 3) Create/Update Container App, ingress, env vars, ACR auth
  - job: DeployACA
    displayName: Create/Update Azure Container App
    dependsOn:
      - GetEnv
      - BuildAndPush
    variables:
      RESOURCE_GROUP:     $[ dependencies.GetEnv.outputs['loadEnv.RESOURCE_GROUP'] ]
      LOCATION:           $[ dependencies.GetEnv.outputs['loadEnv.LOCATION'] ]
      CONTAINER_APP_ENV:  $[ dependencies.GetEnv.outputs['loadEnv.CONTAINER_APP_ENV'] ]
      CONTAINER_APP_NAME: $[ dependencies.GetEnv.outputs['loadEnv.CONTAINER_APP_NAME'] ]
      LOG_ANALYTICS_NAME: $[ dependencies.GetEnv.outputs['loadEnv.LOG_ANALYTICS_NAME'] ]
      UAMI_ID:            $[ dependencies.GetEnv.outputs['loadEnv.UAMI_ID'] ]
      UAMI_CLIENT_ID:     $[ dependencies.GetEnv.outputs['loadEnv.UAMI_CLIENT_ID'] ]
      KEYVAULT_URL:       $[ dependencies.GetEnv.outputs['loadEnv.KEYVAULT_URL'] ]
      ACR_LOGIN_SERVER:   $[ dependencies.GetEnv.outputs['loadEnv.ACR_LOGIN_SERVER'] ]
      ACR_NAME:           $[ dependencies.GetEnv.outputs['loadEnv.ACR_NAME'] ]
      FullImageRef:       $[ dependencies.BuildAndPush.outputs['buildpush.FullImageRef'] ]
    steps:
      - task: AzureCLI@2
        displayName: Create/Update Container App (with ingress)
        inputs:
          azureSubscription: $(azureServiceConnection)
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail

            RG="$(RESOURCE_GROUP)"
            LOC="$(LOCATION)"
            ENV_NAME="$(CONTAINER_APP_ENV)"
            APP_NAME="$(CONTAINER_APP_NAME)"
            LAW_NAME="$(LOG_ANALYTICS_NAME)"
            ACR_SERVER="$(ACR_LOGIN_SERVER)"
            ACR_NAME="$(ACR_NAME)"
            IMAGE="$(FullImageRef)"
            PORT="$(containerPort)"
            INGRESS="$(ingressType)"
            KV_URL="$(KEYVAULT_URL)"
            UAMI_ID="${UAMI_ID}"
            UAMI_CLIENT_ID="${UAMI_CLIENT_ID}"

            echo "RG=$RG ENV=$ENV_NAME APP=$APP_NAME ACR=$ACR_NAME/$ACR_SERVER PORT=$PORT INGRESS=$INGRESS UAMI_ID=$UAMI_ID UAMI_CLIENT_ID=$UAMI_CLIENT_ID"

            az provider register --namespace Microsoft.App --wait
            az provider register --namespace Microsoft.OperationalInsights --wait
            az group create -n "$RG" -l "$LOC" 1>/dev/null

            if ! az monitor log-analytics workspace show -g "$RG" -n "$LAW_NAME" &>/dev/null; then
              az monitor log-analytics workspace create -g "$RG" -n "$LAW_NAME" -l "$LOC"
            fi
            LAW_CUST_ID=$(az monitor log-analytics workspace show -g "$RG" -n "$LAW_NAME" --query customerId -o tsv | tr -d '\r')
            LAW_KEY=$(az monitor log-analytics workspace get-shared-keys -g "$RG" -n "$LAW_NAME" --query primarySharedKey -o tsv | tr -d '\r')

            if ! az containerapp env show -g "$RG" -n "$ENV_NAME" &>/dev/null; then
              az containerapp env create -g "$RG" -n "$ENV_NAME" -l "$LOC" \
                --logs-workspace-id "$LAW_CUST_ID" --logs-workspace-key "$LAW_KEY"
            fi

            if ! az containerapp show -g "$RG" -n "$APP_NAME" &>/dev/null; then
              if [ -n "$UAMI_ID" ]; then
                az containerapp create -g "$RG" -n "$APP_NAME" \
                  --environment "$ENV_NAME" --image "$IMAGE" \
                  --registry-server "$ACR_SERVER" \
                  --ingress "$INGRESS" \                 
                  --registry-identity "$UAMI_ID" 
              else
                az containerapp create -g "$RG" -n "$APP_NAME" \
                  --environment "$ENV_NAME" --image "$IMAGE" \
                  --registry-server "$ACR_SERVER" --system-assigned
              fi
            else
              az containerapp update -g "$RG" -n "$APP_NAME" --image "$IMAGE"
            fi

            # Ensure ingress (separate command works across CLI versions)
            az containerapp ingress enable -g "$RG" -n "$APP_NAME" --type "$INGRESS" --target-port "$PORT" || \
            az containerapp ingress set    -g "$RG" -n "$APP_NAME" --type "$INGRESS" --target-port "$PORT"

            # Configure ACR auth
            ACR_ID=$(az acr show -n "$ACR_NAME" --query id -o tsv)

            if [ -n "$UAMI_ID" ]; then
              # 1) Attach the UAMI to the app (safe to re-run)
              az containerapp identity assign -g "$RG" -n "$APP_NAME" --user-assigned "$UAMI_ID" 1>/dev/null

              # 2) Grant AcrPull to the UAMI principal
              UAMI_PRINCIPAL_ID=$(az identity show --ids "$UAMI_ID" --query principalId -o tsv)
              az role assignment create \
                --assignee-object-id "$UAMI_PRINCIPAL_ID" \
                --assignee-principal-type ServicePrincipal \
                --role "AcrPull" \
                --scope "$ACR_ID" >/dev/null || true

              # 3) Tell the app to use THIS UAMI for registry pulls
              #    IMPORTANT: pass the UAMI RESOURCE ID here, not the word 'userAssigned'
              #    Add a short retry to dodge eventual-consistency blips.


              [[ -n "$UAMI_ID" || -n "$UAMI_CLIENT_ID" ]] || { echo "No identity provided"; exit 2; }


              for i in 1 2 3 4 5; do
                if az containerapp registry set -g "$RG" -n "$APP_NAME" --server "$ACR_SERVER" --identity "$UAMI_ID" 1>/dev/null; then
                  break
                fi
                echo "Retrying registry set with UAMI ($i/5)..."
                sleep 5
              done
            else
              # System-assigned identity path
              az containerapp identity assign -g "$RG" -n "$APP_NAME" --system-assigned 1>/dev/null
              PRINCIPAL_ID=$(az containerapp show -g "$RG" -n "$APP_NAME" --query identity.principalId -o tsv)
              az role assignment create \
                --assignee-object-id "$PRINCIPAL_ID" \
                --assignee-principal-type ServicePrincipal \
                --role "AcrPull" \
                --scope "$ACR_ID" >/dev/null || true
              az containerapp registry set -g "$RG" -n "$APP_NAME" --server "$ACR_SERVER" --identity system 1>/dev/null
            fi

            # App env vars (your code needs KEYVAULT_URL; if UAMI is used, pass AZURE_CLIENT_ID for DefaultAzureCredential)
            if [ -n "$UAMI_CLIENT_ID" ]; then
              az containerapp update -g "$RG" -n "$APP_NAME" \
                --set-env-vars KEYVAULT_URL="$KV_URL" AZURE_CLIENT_ID="$UAMI_CLIENT_ID"
            else
              az containerapp update -g "$RG" -n "$APP_NAME" \
                --set-env-vars KEYVAULT_URL="$KV_URL"
            fi

            echo "FQDN:"
            az containerapp show -g "$RG" -n "$APP_NAME" --query properties.configuration.ingress.fqdn -o tsv
